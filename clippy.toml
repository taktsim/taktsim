# Randomly seeded hash maps would make iteration order differ between runs.
# Banning the types catches every way of building one (`new`, `default`,
# `from`, `collect`). Use BTreeMap/BTreeSet; a map with a fixed hasher needs
# a local `#[allow(clippy::disallowed_types)]` with a comment.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "random iteration order; use BTreeMap" },
    { path = "std::collections::HashSet", reason = "random iteration order; use BTreeSet" },
]
