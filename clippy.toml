# Tests may unwrap and panic (CLAUDE.md, Rust rules).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true

# Determinism (spec §9, ADR-0013): the platform math library may differ
# between OSes and CPUs, so transcendental functions come from `libm`, for
# f64 and f32 alike. `sqrt` is correctly rounded everywhere and stays
# allowed.
disallowed-methods = [
    { path = "f64::ln", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::log", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::log2", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::log10", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::ln_1p", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::exp", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::exp2", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::exp_m1", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::powf", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::powi", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::sin", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::cos", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::tan", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::sin_cos", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::asin", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::acos", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::atan", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::atan2", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::sinh", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::cosh", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::tanh", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::asinh", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::acosh", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::atanh", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::cbrt", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::hypot", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f64::mul_add", reason = "no fused multiply-add in engine or sampling code (ADR-0010)" },
    { path = "f32::ln", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::log", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::log2", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::log10", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::ln_1p", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::exp", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::exp2", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::exp_m1", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::powf", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::powi", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::sin", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::cos", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::tan", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::sin_cos", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::asin", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::acos", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::atan", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::atan2", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::sinh", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::cosh", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::tanh", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::asinh", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::acosh", reason = "platform math library; use libm (ADR-0013)" },
    { path = "f32::atanh", reason = "platform math library; use libm (ADR-0013)" },
