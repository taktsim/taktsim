# cargo-deny policy (spec §7 Tooling baseline, ADR-0006).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# ADR-0006. Anything else is denied until reviewed in a PR with the
# `gate-change` label.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# The list is the policy, not an inventory of what is in use today.
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace path dependencies carry a version, so wildcards = "deny" holds.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
