[workspace]
resolver = "3"
members = [
    "crates/taktsim-units",
    "crates/taktsim-core",
    "crates/taktsim-trace",
    "crates/taktsim-model",
    "crates/taktsim-components",
    "crates/taktsim-stats",
    "crates/taktsim-adapters",
    "crates/taktsim-run",
    "crates/taktsim-cli",
    "crates/taktsim-bench",
    "python",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# MSRV: ADR-0011. Raised only in a commit that says so.
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/taktsim/taktsim"
authors = ["The taktsim contributors"]
# Nothing is published before the v0.1 release (M13).
publish = false

[workspace.dependencies]
taktsim-units = { path = "crates/taktsim-units", version = "0.0.0" }
taktsim-core = { path = "crates/taktsim-core", version = "0.0.0" }
taktsim-trace = { path = "crates/taktsim-trace", version = "0.0.0" }
taktsim-model = { path = "crates/taktsim-model", version = "0.0.0" }
taktsim-components = { path = "crates/taktsim-components", version = "0.0.0" }
taktsim-stats = { path = "crates/taktsim-stats", version = "0.0.0" }
taktsim-run = { path = "crates/taktsim-run", version = "0.0.0" }
# Pure-Rust math, so sampling is identical on every platform (ADR-0013).
# Default features off: no hardware code paths at all.
libm = { version = "0.2.16", default-features = false }
thiserror = "2.0.21"
proptest = "1.12.0"
# Tests only: the schema's patterns (taktsim-model), checked against the
# parsers. Already in the lockfile through the benchmarks.
regex = "1.13.1"
# Model loader (M4, ADR-0020): the YAML event parser (wrapped in one
# module) and SHA-256 for the model and system hashes.
saphyr-parser = "0.3.2"
sha2 = { version = "0.11.1", default-features = false }
# Trace (M3, ADR-0021): the stream hash and the per-block checksums.
# Well-known low-level crates are allowed (owner, 2026-11-05); what is
# not is a dependency that grows the bill of materials substantially.
crc32fast = { version = "1.5.4", default-features = false }
# Benchmarks, in taktsim-bench only (ADR-0016): wall-clock locally, without
# the plotting and rayon defaults; instruction counts in CI. The
# gungraun-runner binary must have exactly the version Cargo.lock resolves
# for gungraun; the bench workflow installs it from there.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
gungraun = "0.20.0"
# The command line's parser (ADR-0019, ADR-0024 §2). Default features off, so no
# colour crates and no `strsim`. New in the lock with it: `clap_derive`.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# Signals for `taktsim run`, in taktsim-cli only (ADR-0025 §9): SIGINT, SIGTERM,
# Ctrl+C and Ctrl+Break set one flag. New in the lock with it: `nix` (unix) and
# `windows-sys`, at the version already locked.
ctrlc = { version = "3.5.1", features = ["termination"] }
# Parallel replications, in taktsim-run only (ADR-0025 §8): a thread pool with an
# explicit size, so `RAYON_NUM_THREADS` changes nothing. New in the lock with it:
# `rayon-core`, `crossbeam-deque`, `crossbeam-epoch`, `crossbeam-utils`.
rayon = { version = "1.12.0", default-features = false }
# Golden-trace snapshots (ADR-0021), tests only, without colors or extra
# formats.
insta = { version = "1.49.0", default-features = false }

# Shared lints (spec §7 Layer 1). Every crate opts in with `[lints] workspace = true`;
# ci/check-crates.sh fails if one does not. Changing this section needs the
# `gate-change` label on the PR (ci/check-gates.sh).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
wildcard_enum_match_arm = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
