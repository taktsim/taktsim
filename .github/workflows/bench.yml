# Instruction-count regression gate (spec §7, §10; ADR-0007, ADR-0010,
# ADR-0016): measures the gungraun benchmarks of the pull request's base and
# of the pull request merged into it, one after the other on the same runner,
# and fails if a benchmark's instruction count rose by more than 10 % or a
# benchmark disappeared without being listed in ci/bench-removed.txt.
# Separate from ci.yml so it can be changed without touching the other gates.
# Changing this file needs the `gate-change` label (ci/check-gates.sh).
#
# Adding a benchmark needs no change here: ci/bench-targets.sh selects every
# crates/taktsim-bench/benches/instructions_*.rs target.
name: bench

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Valgrind from the Ubuntu 24.04 release pocket, which never changes
  # (ADR-0016). Base and head run under the same Valgrind in one job, so a
  # Valgrind change alone cannot fail a pull request; the version is printed
  # in the summary.
  VALGRIND: "1:3.22.0-0ubuntu3"

jobs:
  # A pull request that touches only documentation cannot change an
  # instruction count (ci/changes.sh, as in ci.yml).
  changes:
    name: changes (does the benchmark gate apply?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ci/changes-test.sh
      - id: decide
        run: ci/changes.sh "$BASE" "$HEAD" >>"$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  instructions:
    name: benchmarks (instruction counts, > 10 % regression fails)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # The CI proxy runner of ADR-0010 (x86-64 Linux); Callgrind needs Linux.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The merge commit of the pull request and its two parents: HEAD^1 is
      # the base, HEAD the base with the pull request applied.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The gate that judges this pull request is the base's ci/ when the
      # base has the comparison script: a pull request that changes the gate
      # (its rule, threshold or scripts) is judged by the gate it changes,
      # and the change applies from the next pull request on. Only the pull
      # request that introduces the gate is judged by its own scripts.
      - name: commits and gate scripts
        id: commits
        run: |
          base=$(git rev-parse HEAD^1)
          echo "base=$base" >>"$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "pr=$(git rev-parse HEAD^2)" >>"$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/gate"
          if git cat-file -e "$base:ci/bench-compare.sh" 2>/dev/null; then
            git archive "$base" ci Cargo.lock | tar -x -C "$RUNNER_TEMP/gate"
            echo "from=base" >>"$GITHUB_OUTPUT"
            echo "gate=the base's ci/" >>"$GITHUB_OUTPUT"
          else
            cp -R ci Cargo.lock "$RUNNER_TEMP/gate/"
            echo "from=head" >>"$GITHUB_OUTPUT"
            echo "gate=this pull request's ci/ (the base has no gate yet)" >>"$GITHUB_OUTPUT"
          fi

      # The tests first: of the gate in use, and of the head's scripts if
      # they differ, so a broken comparison never passes and a proposed
      # change is tested.
      - name: test the gate (ci/bench-test.sh)
        run: |
          "$RUNNER_TEMP/gate/ci/bench-test.sh"
          if [ "${{ steps.commits.outputs.from }}" = base ]; then
            ci/bench-test.sh
          fi

      - name: install Valgrind
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends "valgrind=$VALGRIND"
          valgrind --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: base, gungraun version
        id: base
        run: |
          git checkout -q --detach "${{ steps.commits.outputs.base }}"
          runner=$("$RUNNER_TEMP/gate/ci/bench-runner-version.sh")
          echo "runner=$runner" >>"$GITHUB_OUTPUT"
      # gungraun-runner must equal the library version in Cargo.lock
      # (gungraun guide). Versions in install-action's manifest come as
      # checksummed release binaries; a newer one is built from crates.io
      # with `cargo install --locked` (ADR-0016).
      - if: steps.base.outputs.runner != ''
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: gungraun-runner@${{ steps.base.outputs.runner }}
          fallback: cargo-install
      - name: base, measure
        run: '"$RUNNER_TEMP/gate/ci/bench-run.sh" "$RUNNER_TEMP/gungraun/base"'

      - name: head, gungraun version
        id: head
        run: |
          git checkout -q --detach "${{ steps.commits.outputs.head }}"
          runner=$("$RUNNER_TEMP/gate/ci/bench-runner-version.sh")
          if [ -z "$runner" ]; then
            echo "error: the head's Cargo.lock has no gungraun" >&2
            exit 1
          fi
          echo "runner=$runner" >>"$GITHUB_OUTPUT"
      - if: steps.head.outputs.runner != steps.base.outputs.runner
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: gungraun-runner@${{ steps.head.outputs.runner }}
          fallback: cargo-install
      - name: head, measure
        run: '"$RUNNER_TEMP/gate/ci/bench-run.sh" --strict "$RUNNER_TEMP/gungraun/head"'

      - name: compare (fails above +10 % or on an unlisted removal)
        env:
          BASE: ${{ steps.commits.outputs.base }}
          HEAD: ${{ steps.commits.outputs.head }}
          PR: ${{ steps.commits.outputs.pr }}
          GATE: ${{ steps.commits.outputs.gate }}
          BASE_RUNNER: ${{ steps.base.outputs.runner }}
          HEAD_RUNNER: ${{ steps.head.outputs.runner }}
        run: |
          status=0
          # The removed list is the head's: the pull request declares what it removes.
          "$RUNNER_TEMP/gate/ci/bench-compare.sh" --removed ci/bench-removed.txt \
            "$RUNNER_TEMP/gungraun/base" "$RUNNER_TEMP/gungraun/head" \
            >"$RUNNER_TEMP/bench.md" 2>"$RUNNER_TEMP/bench.err" || status=$?
          {
            cat "$RUNNER_TEMP/bench.md"
            if [ -s "$RUNNER_TEMP/bench.err" ]; then
              echo '```text'
              cat "$RUNNER_TEMP/bench.err"
              echo '```'
            fi
            echo
            echo "Base \`$BASE\`; head \`$HEAD\`, the pull request (\`$PR\`) merged into the base."
            echo "Judged by $GATE. Measured on $ImageOS ($(uname -m)), $(valgrind --version)," \
              "gungraun-runner ${BASE_RUNNER:-none} (base) and $HEAD_RUNNER (head)."
            echo "Instruction counts gate regressions only; they are not a speed claim (ADR-0010)."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instruction-counts
          path: |
            ${{ runner.temp }}/gungraun/*/**/summary.json
            ${{ runner.temp }}/bench.md
          if-no-files-found: ignore
