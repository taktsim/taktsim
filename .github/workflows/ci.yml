# Quality gates (spec §7, §10; ADR-0007, ADR-0010, ADR-0011).
# Order follows spec §10: rustfmt → clippy → cargo-deny → tests → coverage →
# Python → docs. Steps for crates that do not exist yet (WebAssembly, viewer,
# benchmarks) are added with the milestone that creates them.
# The gates run only when a change can affect them (job changes,
# ci/changes.sh): a pull request that touches only documentation skips them.
# Changing this file needs the `gate-change` label (ci/check-gates.sh).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Pinned nightly for branch coverage and the doc-example check only (ADR-0011).
  NIGHTLY: nightly-2026-10-24
  MSRV: "1.97"

jobs:
  # Can this change affect the gates below? Skipped jobs count as passed for
  # the required checks of main; if this job fails, the test and python
  # checks are never reported, so the pull request cannot be merged.
  changes:
    name: changes (do the Rust and Python gates apply?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ci/changes-test.sh
      - id: decide
        run: ci/changes.sh "$BASE" "$HEAD" >>"$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  lint:
    name: lint (rustfmt, clippy, cargo-deny, crate rules)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PyO3's build script needs Python >= 3.13 (abi3-py313) to compile python/.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check
      - run: ci/check-crates.sh

  test:
    name: test (${{ matrix.target }})
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported targets (ADR-0010): all must pass.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
          - { target: aarch64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      # The Python binding crate is tested by pytest (job python).
      - run: cargo nextest run --workspace --exclude taktsim-python --all-features --locked
      - run: cargo test --workspace --exclude taktsim-python --all-features --doc --locked

  # main requires one check per target. A matrix job that is skipped as a
  # whole reports none of those names, so the pull request would wait for
  # them forever; when the change cannot affect the tests, this job reports
  # them instead, on one small runner. Keep the targets in step with test.
  test-not-needed:
    name: test (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
    steps:
      - run: echo "Not run on $TARGET; only files no test reads changed (see the changes job)." | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          TARGET: ${{ matrix.target }}

  msrv:
    name: msrv
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PyO3's build script needs Python >= 3.13 (abi3-py313) to compile python/.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +"$MSRV" check --workspace --all-targets --all-features --locked

  coverage:
    name: coverage (≥ 90 % lines, 100 % branches in core)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "$NIGHTLY" --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.149
      - run: >-
          cargo +"$NIGHTLY" llvm-cov nextest --workspace --exclude taktsim-python --all-features --locked
          --branch --json --summary-only --output-path coverage.json
      - run: ci/coverage-gate.sh coverage.json

  python:
    name: python (${{ matrix.python }}; pytest, ruff, pyright strict)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The three latest Python versions (spec §7, ADR-0005).
        python: ["3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt
      - run: .venv/bin/maturin develop --locked
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/python/.venv
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pyright --warnings --pythonpath .venv/bin/python
      - run: .venv/bin/pytest -q

  # As test-not-needed, for the required check of each Python version. Keep
  # the versions in step with python.
  python-not-needed:
    name: python (${{ matrix.python }}; pytest, ruff, pyright strict)
    needs: changes
    if: needs.changes.outputs.rust == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.13", "3.14", "3.15"]
    steps:
      - run: echo "Not run on Python $PYTHON; only files no test reads changed (see the changes job)." | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          PYTHON: ${{ matrix.python }}

  docs:
    name: docs (every public item documented, with an example)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PyO3's build script needs Python >= 3.13 (abi3-py313) to compile python/.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustdoc, warnings denied
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # "A doc test for every public item" (spec §7): the lint is nightly-only.
      - name: doc example on every public item
        run: cargo +"$NIGHTLY" doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: >-
            -D warnings -Z unstable-options
            -Zcrate-attr=feature(rustdoc_missing_doc_code_examples)
            -D rustdoc::missing-doc-code-examples
      # Stable rustdoc only checks that a compile_fail example fails; nightly
      # also checks its error code (e.g. E0308), so it fails for the right reason.
      - name: doc tests with compile_fail error codes checked
        run: cargo +"$NIGHTLY" test --workspace --exclude taktsim-python --all-features --doc --locked

  mutants:
    name: mutants (core, changed code, advisory)
    # ADR-0007: reported on every PR, required from v1.0.
    if: github.event_name == 'pull_request'
    needs: lint
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.149
      - run: git diff "origin/${{ github.base_ref }}...HEAD" -- crates/taktsim-core > core.diff
      # Exit 0: every mutant caught. Exit 3: some timed out and none were
      # missed; a timeout means the mutant made a test hang (e.g. a rejection
      # loop that never accepts), which counts as caught. Exit 2 (missed) or
      # anything else fails this advisory job. Known equivalent mutants are
      # listed in .cargo/mutants.toml.
      - name: mutate changed core code
        run: |
          set +e
          cargo mutants --in-diff core.diff --package taktsim-core --test-tool nextest --no-shuffle
          code=$?
          set -e
          ci/mutants-summary.sh mutants.out >> "$GITHUB_STEP_SUMMARY"
          case "$code" in 0|3) exit 0 ;; *) exit "$code" ;; esac
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: ignore
