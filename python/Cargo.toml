[package]
name = "taktsim-python"
description = "Python bindings for taktsim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "taktsim"
crate-type = ["cdylib"]
# Tested through pytest (python/tests), not cargo test (ADR-0005).
test = false
doctest = false

[dependencies]
# abi3 from the oldest of the three latest Python versions (ADR-0005).
pyo3 = { version = "0.30.1", features = ["abi3-py313"] }

[lints]
workspace = true
