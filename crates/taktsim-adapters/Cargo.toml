[package]
name = "taktsim-adapters"
description = "Data adapters for taktsim, each behind a Cargo feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
taktsim-units = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[features]
default = []
# CSV import into the observation table, CSV export of it, and a typed CSV
# writer for results and traces (M11, ADR-0017).
csv = ["dep:taktsim-units", "dep:thiserror"]
