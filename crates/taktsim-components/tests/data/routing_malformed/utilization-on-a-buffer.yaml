format: "1.0"
model: {name: bad}
experiment: {type: terminating, horizon: 1h}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: b, type: Buffer, capacity: 2 parts}
  - {id: m, type: Machine, cycle_time: 1min}
  - {id: a, type: Sink}
flow:
  - {from: source, to: [b, m], choose: lowest_utilization}
  - {from: [b, m], to: a}
