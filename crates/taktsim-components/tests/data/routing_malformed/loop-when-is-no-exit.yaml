format: "1.0"
model: {name: bad}
experiment: {type: terminating, horizon: 1h}
components:
  - {id: source, type: Source, interarrival: 1min, variants: {red: 50%, blue: 50%}}
  - {id: m, type: Machine, cycle_time: 1min}
  - {id: q, type: Machine, cycle_time: 1min}
  - {id: a, type: Sink}
flow:
  - [source, m, q]
  - {from: q, to: m, when: "variant == 'red'"}
  - {from: q, to: a}
# expect: flow[1].to @ 11:19 NotAllowed
