format: "1.0"
model: {name: bad}
experiment: {type: terminating, horizon: 1h}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: m, type: Machine, cycle_time: 1min}
  - {id: k, type: Machine, cycle_time: 1min}
  - {id: q, type: Machine, cycle_time: 1min}
  - {id: a, type: Sink}
flow:
  - [source, m, k]
  - {from: k, to: m, when: "priority > 0"}
  - {from: k, to: q}
  - {from: q, split: {m: 5%, a: 95%}}
# expect: flow[1].to @ 12:19 NotAllowed
