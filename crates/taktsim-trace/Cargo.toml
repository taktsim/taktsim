[package]
name = "taktsim-trace"
description = "Trace writer, reader and replay for taktsim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
taktsim-units.workspace = true
taktsim-core.workspace = true
thiserror.workspace = true
sha2.workspace = true
crc32fast.workspace = true

[dev-dependencies]
proptest.workspace = true
insta.workspace = true

[features]
default = []
# The golden-trace harness for tests of reference models (ADR-0021): runs a
# model, checks that it replays, and writes its trace hashes for the
# cross-platform comparison in CI.
golden = []

[[test]]
name = "golden"
required-features = ["golden"]
