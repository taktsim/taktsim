[package]
name = "taktsim-cli"
description = "The taktsim command line: describe, schema, validate and run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "taktsim"
path = "src/main.rs"
# The CLI is documented by --help; its rustdoc page would collide with the
# Python module's, which is also named `taktsim`.
doc = false

[lints]
workspace = true

[dependencies]
taktsim-units.workspace = true
taktsim-model.workspace = true
taktsim-components.workspace = true
taktsim-run.workspace = true
clap.workspace = true
ctrlc.workspace = true

[dev-dependencies]
insta.workspace = true
regex.workspace = true
