[package]
name = "taktsim-model"
description = "Model types, expression language, loader and schema generation for taktsim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
taktsim-units = { workspace = true, features = ["serde", "schemars"] }
# Distribution parameters are checked by the constructors that sample them.
taktsim-core.workspace = true
thiserror.workspace = true
saphyr-parser.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
schemars.workspace = true

[dev-dependencies]
proptest.workspace = true
regex.workspace = true
