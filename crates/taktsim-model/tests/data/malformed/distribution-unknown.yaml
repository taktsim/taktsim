# A misspelt distribution.
format: "1.0"
model: {name: m}
experiment: {type: terminating, horizon: 8h}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: cut, type: Machine, cycle_time: {dist: lognrmal, mean: 42s, sigma: 0.08}}
  - {id: sink, type: Sink}
flow:
  - [source, cut, sink]
observe:
  - throughput(sink)
# expect: components[1].cycle_time.dist @ 7:49 UnknownValue
