# A condition, which arrives with M6.
format: "1.0"
model: {name: m}
experiment: {type: terminating, horizon: 8h}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: cut, type: Machine, cycle_time: 42s}
  - {id: sink, type: Sink}
flow:
  - [source, cut]
  - {from: cut, to: sink, when: "variant == 'premium'"}
observe:
  - throughput(sink)
# expect: flow[1].when @ 11:27 UnknownField
