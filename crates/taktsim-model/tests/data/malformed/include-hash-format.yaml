# A pinned hash in upper case.
format: "1.0"
model: {name: m}
include: [{path: parts/ok.yaml, sha256: ABC}]
experiment: {type: terminating, horizon: 8h}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: cut, type: Machine, cycle_time: 42s}
  - {id: sink, type: Sink}
flow:
  - [source, cut, sink]
observe:
  - throughput(sink)
