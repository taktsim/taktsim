# A precision for a constant.
format: "1.0"
model: {name: m}
experiment: {type: terminating, horizon: 8h, precision: {1 + 2: 2%}}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: cut, type: Machine, cycle_time: 42s}
  - {id: sink, type: Sink}
flow:
  - [source, cut, sink]
observe:
  - throughput(sink)
# expect: experiment.precision["1 + 2"] @ 4:58 NotAnObservable
