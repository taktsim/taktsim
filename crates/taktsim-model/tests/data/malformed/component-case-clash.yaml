# Ids that differ only in case.
format: "1.0"
model: {name: m}
experiment: {type: terminating, horizon: 8h}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: cut, type: Machine, cycle_time: 42s}
  - {id: sink, type: Sink}
  - {id: Cut, type: Buffer, capacity: 5 parts}
flow:
  - [source, cut, sink]
observe:
  - throughput(sink)
# expect: components[3].id @ 9:10 CaseClash
