# The model includes itself.
format: "1.0"
model: {name: m}
include: [include-self.yaml]
experiment: {type: terminating, horizon: 8h}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: cut, type: Machine, cycle_time: 42s}
  - {id: sink, type: Sink}
flow:
  - [source, cut, sink]
observe:
  - throughput(sink)
# expect: include[0] @ 4:11 IncludeSelf
