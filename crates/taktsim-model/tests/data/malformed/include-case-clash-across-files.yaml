# An id in the model that differs only in case from one in an included file.
format: "1.0"
model: {name: m}
include: [parts/ok.yaml]
experiment: {type: terminating, horizon: 8h}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: cut, type: Machine, cycle_time: 42s}
  - {id: sink, type: Sink}
  - {id: Extra, type: Buffer, capacity: 1 parts}
flow:
  - [source, cut, sink]
observe:
  - throughput(sink)
# expect: components[3].id @ 10:10 CaseClash
