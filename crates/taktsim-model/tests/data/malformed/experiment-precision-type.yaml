# A precision on a non-numeric expression.
format: "1.0"
model: {name: m}
experiment: {type: terminating, horizon: 8h, precision: {'throughput(sink) > 1 parts/h': 2%}}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: cut, type: Machine, cycle_time: 42s}
  - {id: sink, type: Sink}
flow:
  - [source, cut, sink]
observe:
  - throughput(sink)
# expect: experiment.precision["throughput(sink) > 1 parts/h"] @ 4:59 Expression
