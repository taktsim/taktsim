# A parameter left out.
format: "1.0"
model: {name: m}
experiment: {type: terminating, horizon: 8h}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: cut, type: Machine, cycle_time: {dist: normal, mean: 42s}}
  - {id: sink, type: Sink}
flow:
  - [source, cut, sink]
observe:
  - throughput(sink)
