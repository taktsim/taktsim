# An anchor and an alias.
format: "1.0"
model: {name: m}
experiment: {type: terminating, horizon: 8h}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: cut, type: Machine, cycle_time: 42s}
  - &s {id: sink, type: Sink}
  - *s
flow:
  - [source, cut, sink]
observe:
  - throughput(sink)
# expect: components[2] @ 8:5 Anchor
# expect: components[3] @ 9:5 Alias
