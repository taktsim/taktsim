# A section only a later format has.
format: "1.0"
model: {name: m}
experiment: {type: terminating, horizon: 8h}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: cut, type: Machine, cycle_time: 42s}
  - {id: sink, type: Sink}
flow:
  - [source, cut, sink]
observe:
  - throughput(sink)
shifts:
  - {calendar: two-shift, applies_to: [cut]}
