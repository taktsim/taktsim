# An edge without `to`.
format: "1.0"
model: {name: m}
experiment: {type: terminating, horizon: 8h}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: cut, type: Machine, cycle_time: 42s}
  - {id: sink, type: Sink}
flow:
  - [source, cut, sink]
  - {from: cut}
observe:
  - throughput(sink)
# expect: flow[1].to @ 11:5 MissingField
