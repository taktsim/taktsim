# Steady state needs a warm-up rule.
format: "1.0"
model: {name: m}
experiment: {type: steady_state, horizon: 8h}
components:
  - {id: source, type: Source, interarrival: 1min}
  - {id: cut, type: Machine, cycle_time: 42s}
  - {id: sink, type: Sink}
flow:
  - [source, cut, sink]
observe:
  - throughput(sink)
# expect: experiment.type @ 4:20 SteadyStateUnsupported
