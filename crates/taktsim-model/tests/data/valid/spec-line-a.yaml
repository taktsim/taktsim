# The v0.1 model document of spec §4, with the spec's placeholder header
# `simcode: "1.0"` written as `format: "1.0"` (ADR-0008). Its canonical
# form and hash are pinned; the spec's own text has the same hash
# (tests/examples.rs). The component types are the tests' stand-ins
# (tests/support/mod.rs).
format: "1.0"           # format version
model:
  name: line-a
  time_unit: s
  seed: 42
experiment:
  type: terminating        # steady_state needs a warm-up rule (M9)
  horizon: 8h
  precision: { throughput(sink): 2% }   # replications until the CI half-width is within 2 %
components:
  - id: source
    type: Source
    interarrival: { dist: exponential, mean: 40s }
  - id: cut
    type: Machine
    cycle_time: { dist: lognormal, mean: 42s, sigma: 0.08 }
    mtbf: 6h
    mttr: { dist: exponential, mean: 12min }
  - id: buf1
    type: Buffer
    capacity: 20 parts
  - id: weld
    type: Machine
    cycle_time: 45s
    setup: { per_variant: 4min }
  - id: sink
    type: Sink
flow:
  - [source, cut, buf1, weld, sink]   # shorthand for a chain of edges
observe:
  - throughput(sink)
  - state_shares(cut, weld)
  - wip(buf1)
