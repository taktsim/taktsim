# The documentation site (spec §10: mdBook). The content lives in docs/;
# this directory holds only the site's configuration, styles and scripts.
# Build: `mdbook build website` (see CONTRIBUTING.md, Working on the docs).

[book]
title = "taktsim"
authors = ["The taktsim contributors"]
language = "en"
src = "../docs"

[build]
build-dir = "book"
# A chapter missing from docs/ is an error, not a new empty file.
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

# Formulas ($...$ inline, $$...$$ as a block) are rendered to HTML at build
# time: no JavaScript and nothing from a CDN when a page is read. MathML
# goes along for screen readers.
[preprocessor.katex]
after = ["links"]
output = "htmlAndMathml"
# The stylesheet is served from theme/katex.min.css instead of a CDN.
no-css = true

[output.html]
site-url = "/taktsim/"
git-repository-url = "https://github.com/taktsim/taktsim"
# {path} starts with ../docs/, relative to this directory.
edit-url-template = "https://github.com/taktsim/taktsim/edit/main/website/{path}"
default-theme = "light"
preferred-dark-theme = "coal"
additional-css = ["theme/katex.min.css", "theme/tokens.css", "theme/taktsim.css"]
# mermaid*.js are written by `mdbook-mermaid install website` and not committed.
additional-js = ["mermaid.min.js", "mermaid-init.js", "components/sim.js", "components/viz.js"]
# Chapter numbers are part of the titles of the concept pages.
no-section-label = true
# Keep file names as written: fonts/fonts.css refers to the font files by name.
hash-files = false
